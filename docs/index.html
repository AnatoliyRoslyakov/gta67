<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eae9df">
<link rel="license" href="characters-credits.txt">
<link rel="icon" href="index.icon.png">
<title>Город в кубе</title>
<style>
:root{color-scheme:light;--paper:#eae9df;--ink:#273e38;--line:#bfc6b8;--quiet:#56675e;--red:#ae553a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:3px solid var(--red);outline-offset:-3px}svg{display:block}
.page{position:fixed;inset:0;isolation:isolate}
main,.viewer,.stage{position:absolute;inset:0}
header{position:absolute;z-index:2;top:max(22px,env(safe-area-inset-top));right:max(24px,env(safe-area-inset-right));pointer-events:none}
.live{display:flex;align-items:center;gap:7px;color:var(--quiet);font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
.dot{width:6px;height:6px;border-radius:50%;background:#ad9354}.ready .dot{background:#508261}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}.viewer canvas:active{cursor:grabbing}
.overlay{position:absolute;inset:0;display:grid;place-content:center;background:var(--paper);text-align:center;color:var(--quiet);padding:25px}.overlay[hidden]{display:none}progress{accent-color:var(--red);width:160px;height:5px;margin:12px auto}
footer,.period-bar{position:absolute;left:50%;transform:translateX(-50%);z-index:1;pointer-events:none}
footer{bottom:max(18px,env(safe-area-inset-bottom))}
.tools,.periods,.period-bar{display:flex;align-items:center;gap:5px}
body{transition:background-color .8s,color .8s}
body[data-time=morning]{--paper:#e9e4db}
body[data-time=evening]{--paper:#d4c4bb;--line:#ad9e94}
body[data-time=night]{--paper:#232d34;--ink:#eeeae1;--quiet:#b9c7c8;--line:#47565a;--red:#da976f}
.period-bar{top:max(16px,env(safe-area-inset-top));gap:9px}
.period-bar button,.tools button{
 pointer-events:auto;display:grid;place-items:center;border:0;border-radius:100px;color:var(--ink);
 background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 65%),rgba(228,238,235,.17);
 -webkit-backdrop-filter:blur(7px) saturate(1.12);backdrop-filter:blur(7px) saturate(1.12);
 box-shadow:inset 0 1px 1px #ffffff80,inset 0 -1px 1px #69878024,0 2px 6px #30443c0c;
 transition:background-color .22s,box-shadow .22s;
}
.periods button{min-width:54px;height:35px;padding:0 13px;font-size:13px}
.sound,.tools button{width:35px;height:35px}
.period-bar button:hover,.tools button:hover{background-color:rgba(240,250,248,.34)}
.period-bar button[aria-pressed=true],.tools button[aria-pressed=true]{
 background-color:rgba(246,254,251,.55);box-shadow:inset 0 1px 2px #ffffffbb,0 2px 7px #546f651c;
}
body[data-time=night] button{background-color:rgba(33,45,50,.30)}
body[data-time=night] button[aria-pressed=true]{background-color:rgba(109,139,145,.42)}
button:disabled{opacity:.45;cursor:wait}
@media(max-width:540px){header{top:max(10px,env(safe-area-inset-top));right:14px}.period-bar{top:calc(max(10px,env(safe-area-inset-top)) + 22px)}}
.sound [data-muted]{display:block}.sound[aria-pressed=true] [data-muted]{display:none}
.sound [data-playing]{display:none}.sound[aria-pressed=true] [data-playing]{display:block}
.periods button:disabled{opacity:.45;cursor:wait}
@media(max-width:380px){.periods button{min-width:47px;padding:7px 8px}}
.tools .action{width:auto;padding:0 12px;font-size:12px;white-space:nowrap}
.tools{justify-content:center}.walk-pad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,42px);gap:4px;width:max-content;margin:0 auto 9px;touch-action:none}
.walk-pad[hidden]{display:none}.walk-pad button{width:42px;height:42px;touch-action:none;user-select:none;-webkit-user-select:none;font-size:19px}
.walk-pad .up{grid-column:2}.walk-pad .left{grid-column:1}
.walk-pad button.held{background-color:#bbd7d9b3}
@media(max-width:440px){.tools{gap:3px}.tools .action{padding:0 8px}.tools button{min-width:32px}.tools{width:max-content}}
</style>
</head>
<body>
<div class="page">
<header><div class="live" role="status"><span class="dot"></span><span id="live">Загрузка</span></div></header>
<main aria-label="Город в кубе">
<div class="viewer"><div class="period-bar"><div class="periods" role="group" aria-label="Время суток">
<button disabled data-cmd="morning" aria-pressed="false">Утро</button><button disabled data-cmd="day" aria-pressed="true">День</button><button disabled data-cmd="evening" aria-pressed="false">Вечер</button><button disabled data-cmd="night" aria-pressed="false">Ночь</button></div>
<button type="button" class="sound" aria-label="Звук города" title="Звук города" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3Z"/><g data-playing><path d="M15 8q4 4 0 8m3-11q7 7 0 14"/></g><path data-muted d="m16 9 6 6m0-6-6 6"/></svg></button></div>
<div class="stage"><canvas id="canvas" tabindex="0" title="Двойной щелчок — приблизить выбранную улицу" aria-label="Трёхмерный квартал. Стрелки вращают камеру, плюс и минус меняют масштаб."></canvas><div class="overlay" id="status"><span id="message">Загружаем квартал…</span><progress id="progress"></progress></div></div></div></main>
<footer>
<div class="tools walk-pad" role="group" aria-label="Движение персонажа" hidden>
<button class="up" data-dir="up" aria-label="Вперёд">↑</button><button class="left" data-dir="left" aria-label="Влево">←</button><button data-dir="down" aria-label="Назад">↓</button><button data-dir="right" aria-label="Вправо">→</button></div>
<div role="group" aria-label="Управление кварталом" class="tools">
<button class="action" data-cmd="traffic" disabled title="Перезапустить автомобильный трафик">↻ Трафик</button>
<button class="action" data-cmd="walk" disabled aria-pressed="false" title="Управлять прохожим: WASD или стрелки">Вселиться</button>
<button data-cmd="spin" disabled aria-label="Автовращение" aria-pressed="true" title="Автовращение"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8c2-3 11-4 14 0s-1 9-8 9c-4 0-7-1-8-4m0 4v-4h4"/><circle cx="12" cy="11" r="2"/></svg></button>
<button data-cmd="out" disabled aria-label="Отдалить" title="Отдалить"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12"/></svg></button>
<button data-cmd="in" disabled aria-label="Приблизить" title="Приблизить"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12M8 2v12"/></svg></button>
<button data-cmd="reset" disabled aria-label="Исходный ракурс" title="Исходный ракурс"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8a7 7 0 1 1 1 6M3 3v5h5"/></svg></button></div></footer></div>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas'), overlay=document.getElementById('status'), live=document.getElementById('live');
const buttons=[...document.querySelectorAll('[data-cmd]')];
let command,walking=false;
const pad=document.querySelector('.walk-pad');
const pressed=new Map();
const keys={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
function sendMove(){
 const held=new Set(pressed.values());
 command?.('move',Number(held.has('right'))-Number(held.has('left')),Number(held.has('down'))-Number(held.has('up')));
 pad.querySelectorAll('button').forEach(b=>b.classList.toggle('held',held.has(b.dataset.dir)));
}
function stopMove(){pressed.clear();if(walking)sendMove()}
pad.querySelectorAll('button').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);pressed.set(e.pointerId,b.dataset.dir);sendMove()});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,e=>{if(pressed.delete(e.pointerId))sendMove()});
});
for(const type of ['keydown','keyup'])window.addEventListener(type,e=>{
 if(!walking)return;
 if(e.code==='Escape' && type==='keydown'){e.preventDefault();command('walk');return}
 if(!keys[e.code])return;
 e.preventDefault();e.stopImmediatePropagation();
 if(type==='keydown')pressed.set(e.code,keys[e.code]);else pressed.delete(e.code);
 sendMove();
},true);
window.addEventListener('blur',stopMove);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMove()});
window.quarterUI={
 connectGame(fn){
  command=fn;
  buttons.forEach(b=>b.disabled=false);
  live.textContent='В эфире';
  document.body.classList.add('ready');
  overlay.hidden=true;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(()=>command('spin'));
 },
 trafficBusy(busy){document.querySelector('[data-cmd=traffic]').disabled=busy},
 walkChanged(active){
  stopMove();walking=active;pad.hidden=!active;
  const b=document.querySelector('[data-cmd=walk]');
  b.textContent=active?'Выйти':'Вселиться';b.setAttribute('aria-pressed',String(active));
  document.querySelector('[data-cmd=spin]').disabled=active;
 },
 spinChanged(on){document.querySelector('[data-cmd=spin]').setAttribute('aria-pressed',String(on))}
};
buttons.forEach(b=>b.addEventListener('click',()=>{
 const key=b.dataset.cmd;
 command?.(key);
 if(b.closest('.periods')){
  document.body.dataset.time=key;
  document.querySelectorAll('.periods button').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===b)));
 }
}));
const soundButton=document.querySelector('.sound');
const city=new Audio('city.m4a');
city.preload='none'; city.loop=true; city.volume=.48;
let wantsSound=true;
function syncSound(){soundButton.setAttribute('aria-pressed',String(!city.paused))}
city.addEventListener('playing',syncSound);city.addEventListener('pause',syncSound);
async function startSound(){if(wantsSound && !document.hidden){try{await city.play()}catch{}syncSound()}}
soundButton.addEventListener('click',()=>{
 if(!city.paused){wantsSound=false;city.pause()}else{wantsSound=true;startSound()}
});
function firstGesture(e){
 if(soundButton.contains(e.target))return;
 document.removeEventListener('pointerdown',firstGesture);
 document.removeEventListener('keydown',firstGesture);
 startSound();
}
document.addEventListener('pointerdown',firstGesture);document.addEventListener('keydown',firstGesture);
document.addEventListener('visibilitychange',()=>{if(document.hidden)city.pause();else startSound()});
function resize(){
 const rect=canvas.getBoundingClientRect(), scale=Math.min(devicePixelRatio||1,1.6);
 canvas.width=Math.max(1,Math.round(rect.width*scale));
 canvas.height=Math.max(1,Math.round(rect.height*scale));
}
new ResizeObserver(resize).observe(canvas.parentElement);
function failure(error){
 overlay.hidden=false;live.textContent='Ошибка запуска';
 document.getElementById('message').textContent='Не удалось открыть квартал. '+String(error);
 document.getElementById('progress').hidden=true;
}
try {
 const config={"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":23791552,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
 const missing=Engine.getMissingFeatures({threads:false});
 if(missing.length) throw Error('Требуется '+missing.join(', '));
 resize();
 new Engine(config).startGame({canvas,canvasResizePolicy:0,onProgress:(loaded,total)=>{
  const p=document.getElementById('progress');
  if(total>0){p.max=total;p.value=loaded}
 }}).catch(failure);
} catch(error){failure(error)}
</script></body></html>
